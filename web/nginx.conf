server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Overwrite (not append) the forwarded address so a client cannot fake its IP
    # and dodge the rate limit.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://api:3000;
    }

    # Short codes have no dot in them, so they never clash with index.html, app.js, etc.
    location ~ "^/[A-Za-z0-9_-]{3,32}$" {
        proxy_pass http://api:3000;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
